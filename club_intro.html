<h1 align="center">📢大提琴社团活动详情介绍</h1>
<hr>
<p>大提琴社每学期开设丰富的弦乐相关活动。零基础公开课面向全校同学开放，没有乐器也可以前来旁听体验。室内乐重奏沙龙是社团特色活动，大家自由分组，练习二重奏、四重奏等室内乐作品。</p>
<p>社团期末汇报音乐会，愿意登台的社员都可以获得表演机会，不限制演奏水平。艺术楼204排练教室每周固定时段对外开放，社团备有公用大提琴供社员练习。不管你是古典乐爱好者，还是刚刚听说大提琴的新朋友，都欢迎来感受大提琴浑厚动人的音色！</p>
